[run]
name = "colliding-rings"
output_dir = "./output/colliding-rings"

[domain]
type = "periodic3d"
n = 128
l = 6.283185307179586
backend = "auto"

[physics]
nu = 1.5e-3

[precision]
tier = "f64"

[integrator]
method = "etd-rk4"
cfl_safety = 0.5

[initial_condition]
type = "colliding-vortex-rings"

[commit_cycle]
diagnostics_interval = 5
snapshot_interval = 100000
checkpoint_interval = 20

[diagnostics]
conservation_audit = true

[termination]
max_time = 12.0
max_wall_hours = 8.0
