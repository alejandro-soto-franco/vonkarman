# Taylor-Green vortex 128^3 run for the flowforms turbulence-cascade hero.
# Re = 1/nu = 800: at 128^3 (3/2-dealiased) this resolves the cascade and
# vortex breakdown cleanly without grid-scale aliasing. The classic Re=1600 TG
# needs 256^3+ to stay clean. Dense checkpoint cadence for a smooth animation.

[run]
name = "taylor-green-hero"
output_dir = "./output/taylor-green-hero"

[domain]
type = "periodic3d"
n = 128
l = 6.283185307179586
backend = "auto"

[physics]
nu = 1.25e-3

[precision]
tier = "f64"

[integrator]
method = "etd-rk4"
cfl_safety = 0.5

[initial_condition]
type = "taylor-green"

[commit_cycle]
diagnostics_interval = 1
snapshot_interval = 100000
checkpoint_interval = 1

[diagnostics]
conservation_audit = true

[termination]
max_time = 14.0
max_wall_hours = 8.0
