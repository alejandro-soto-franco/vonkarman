[package]
name = "vonkarman-compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute backends (CPU/GPU) for the vonkarman solver"

[dependencies]
vonkarman-core = { workspace = true }
num-complex = { workspace = true }

# GPU backend deps, optional and pulled in only by the `cuda` feature.
# `cuda-bindings` (via cuda-core) reads CUDA_TOOLKIT_PATH at build, so enabling
# `cuda` adds a COMPILE-TIME CUDA SDK dependency; the default build stays
# pure-CPU. The kernel PTX itself is built offline (see kernels/ and
# KERNEL_BUILD.md), so no kernel codegen happens at library build time.
#
# This tracked the fork branch `pr/fma-and-opt-pipeline` until that branch was
# deleted, which broke dependency resolution for every cargo command, optional
# feature or not. It now points at upstream, which moved to NVIDIA/cuda-rust.
# bad4d055 predates the move of the host crates (cuda-bindings, cuda-core,
# cuda-async) to the repository root; a newer rev resolves them from there.
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust", rev = "bad4d05559c188cdcfb3469d1497c5b9c3c303fa", optional = true }
# Used only by the `cuda` feature, to load `cudaMemGetInfo` from libcudart for
# the device-memory probe; same crate the FFT crate uses for cuFFT/cudart.
libloading = { version = "0.8", optional = true }

[dev-dependencies]
ndarray = { workspace = true }

[features]
default = []
cuda = ["dep:cuda-core", "dep:libloading"]
