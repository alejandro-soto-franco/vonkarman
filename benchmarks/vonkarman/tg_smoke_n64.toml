[run]
name = "tg-smoke-n64"
output_dir = "../results/vonkarman_smoke_n64"

[domain]
type = "periodic3d"
n = 64
backend = "cpu"

[physics]
nu = 6.25e-4

[initial_condition]
type = "taylor-green"

[commit_cycle]
diagnostics_interval = 1
checkpoint_interval = 0

[diagnostics]
conservation_audit = false

[termination]
max_steps = 20
